version: '3.8'

services:
  empleados-service:
    build: .
    container_name: empleados-service
    ports:
      - "8083:8083"
    depends_on:
      - mysql-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/empleados_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootroot
    networks:
      - empleados-network

  mysql-db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: empleados_db
    ports:
      - "3306:3306"
    networks:
      - empleados-network

networks:
  empleados-network:
    driver: bridge
